<template>
    <template if:false={showPayments}>
        <div class="page-section">
            <div class="cc-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256"><path d="M224,48H32A16,16,0,0,0,16,64V192a16,16,0,0,0,16,16H224a16,16,0,0,0,16-16V64A16,16,0,0,0,224,48Zm0,16V88H32V64Zm0,128H32V104H224v88Zm-16-24a8,8,0,0,1-8,8H168a8,8,0,0,1,0-16h32A8,8,0,0,1,208,168Zm-64,0a8,8,0,0,1-8,8H120a8,8,0,0,1,0-16h16A8,8,0,0,1,144,168Z"></path></svg>
            </div>
            <h2 class="thank-you-heading">Wonderful! Welcome to the Next Chapter!</h2>
            <p class="thank-you-message">Thank You for Choosing Us! Your Premium Experience Starts Here</p>

            <template if:true={isGeneratingInvoices}>
                <button class="to-pay-btn" onclick={handleGenerateInvoices} disabled={isGeneratingInvoices}>
                    <lightning-spinner class="to-pay-btn-spinner" alternative-text="Loading" size="x-small"></lightning-spinner>
                    Continue to Payment
                </button>
            </template>

            <template if:false={isGeneratingInvoices}>
                <button class="to-pay-btn" onclick={handleGenerateInvoices}>
                    Continue to Payment
                </button>
            </template>
        </div>
    </template>

    <template if:true={showPayments}>
        <div class="page-container slds-p-around_large">

            <!-- Header -->
            <div class="top-section">
                <div class="slds-text-heading_medium">Payment Completion</div>
                <span class="subtitle">Select an offer to review and complete payments</span>
            </div>

            <div class="slds-grid slds-gutters">

                <!-- LEFT: Offers -->
                <div class="slds-col slds-size_4-of-12">
                    <div class="panel-card">

                        <div class="panel-title">
                            <span class="svgIcon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256">
                                    <path d="M232,104a8,8,0,0,0,8-8V64a16,16,0,0,0-16-16H32A16,16,0,0,0,16,64V96a8,8,0,0,0,8,8,24,24,0,0,1,0,48,8,8,0,0,0-8,8v32a16,16,0,0,0,16,16H224a16,16,0,0,0,16-16V160a8,8,0,0,0-8-8,24,24,0,0,1,0-48ZM32,167.2a40,40,0,0,0,0-78.4V64H88V192H32Zm192,0V192H104V64H224V88.8a40,40,0,0,0,0,78.4Z"/>
                                </svg>
                            </span>
                            Offers ({offersDetails.length})
                        </div>

                        <template for:each={offersDetails} for:item="offer">
                            <div
                                key={offer.Id}
                                data-id={offer.Id}
                                onclick={handleOfferSelect}
                                class={offer.cardClass}
                            >
                                <div class="unit-header">
                                    <span class="unit-name">{offer.Name}</span>
                                    <span class="bhk">{offer.Unit__r.Bedrooms__c}BHK</span>
                                </div>

                                <div class="property">{offer.Unit__r.Project__r.Name}</div>

                                <div class="unit-details">
                                    <span>{offer.Unit__r.Total_Area__c} sq.ft</span>
                                    <span class="unit-name">{offer.Unit__r.Name}</span>
                                </div>

                                <div class="unit-price">
                                    <lightning-formatted-number
                                        value={offer.Unit_Price__c}
                                        format-style="currency">
                                    </lightning-formatted-number>
                                    <span class={offer.statusBadgeClass}>{offer.paymentStatus}</span>
                                </div>
                            </div>
                        </template>

                        <template if:true={isLoadingOffers}>
                            <div class="skeleton-card"></div>
                            <div class="skeleton-card"></div>
                        </template>

                        <template if:true={noOffers}>
                            <div class="empty-state">No offers found for this opportunity.</div>
                        </template>

                    </div>
                </div>

                <!-- RIGHT: Payment Plan Items -->
                <div class="slds-col slds-size_8-of-12">
                    <div class="panel-card">

                        <div class="panel-title">
                            <span class="svgIcon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256">
                                    <path d="M80,120h96a8,8,0,0,0,8-8V64a8,8,0,0,0-8-8H80a8,8,0,0,0-8,8v48A8,8,0,0,0,80,120Zm8-48h80v32H88ZM200,24H56A16,16,0,0,0,40,40V216a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V40A16,16,0,0,0,200,24Zm0,192H56V40H200ZM100,148a12,12,0,1,1-12-12A12,12,0,0,1,100,148Zm40,0a12,12,0,1,1-12-12A12,12,0,0,1,140,148Zm40,0a12,12,0,1,1-12-12A12,12,0,0,1,180,148Zm-80,40a12,12,0,1,1-12-12A12,12,0,0,1,100,188Zm40,0a12,12,0,1,1-12-12A12,12,0,0,1,140,188Zm40,0a12,12,0,1,1-12-12A12,12,0,0,1,180,188Z"/>
                                </svg>
                            </span>
                            Installments
                            <template if:true={activeOfferName}>
                                <span class="for-label">— {activeOfferName}</span>
                            </template>
                        </div>

                        <!-- No offer selected -->
                        <template if:false={selectedOfferId}>
                            <div class="empty-state plans-empty">
                                <div class="empty-icon">
                                    <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#0176d3" stroke-width="1.5">
                                        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
                                        <rect x="9" y="3" width="6" height="4" rx="1"/>
                                        <path d="M9 12h6M9 16h4"/>
                                    </svg>
                                </div>
                                <p>Select an offer on the left to view payment plan items.</p>
                            </div>
                        </template>

                        <!-- Offer selected -->
                        <template if:true={selectedOfferId}>

                            <template if:true={isLoadingItems}>
                                <div class="skeleton-plan"></div>
                                <div class="skeleton-plan"></div>
                                <div class="skeleton-plan"></div>
                            </template>

                            <template if:false={isLoadingItems}>

                                <template if:true={hasItems}>
                                    <div class="payments-header">
                                        <span>Installment</span>
                                        <span>Due Date</span>
                                        <span>Amount</span>
                                        <span>Status</span>
                                        <span>Action</span>
                                    </div>
                                    <div class="table-scroll">
                                        <template for:each={paymentPlanItems} for:item="item">
                                            <div key={item.Id} class="payment-row">
                                                <span class="item-name">{item.Name__c}</span>
                                                <lightning-formatted-date-time
                                                    value={item.Tentative_Due_Date__c}
                                                    year="numeric"
                                                    month="short"
                                                    day="2-digit">
                                                </lightning-formatted-date-time>
                                                <lightning-formatted-number
                                                    value={item.Amount__c}
                                                    format-style="currency">
                                                </lightning-formatted-number>
                                                <span class={item.statusPillClass}>{item.Status__c}</span>
                                                <span>
                                                    <template if:true={item.showPayButton}>
                                                        <button
                                                            class="pay-btn"
                                                            data-id={item.Id}
                                                            onclick={openPayModal}>
                                                            Pay
                                                        </button>
                                                    </template>
                                                    <template if:false={item.showPayButton}>
                                                        <span class="dash">—</span>
                                                    </template>
                                                </span>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <template if:false={hasItems}>
                                    <div class="empty-state">No payment plan items found for this offer.</div>
                                </template>

                            </template>
                        </template>

                    </div>
                </div>

            </div>
        </div>
    </template>

    <template if:true={showPayModal}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="modal-heading"
            class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container">

                <!-- Header -->
                <header class="slds-modal__header">
                    <h2
                        id="modal-heading"
                        class="slds-text-heading_medium">
                        Complete Payment
                    </h2>
                </header>

                <!-- Body -->
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-combobox
                        label="Mode"
                        options={modeOptions}
                        value={selectedPaymentMode}
                        onchange={handlePaymentMode}
                        required="true">
                    </lightning-combobox>
                    <lightning-input
                        label="Transaction Number"
                        value={txnNumber}
                        onchange={handletxnNumber}
                        required="true">
                    </lightning-input>
                </div>

                <!-- Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                        onclick={closePayModal}>
                    </lightning-button>

                    <lightning-button
                        variant="brand"
                        label="Save"
                        class="slds-m-left_small"
                        onclick={handlePay}
                        disabled={isPayNowDisabled}>
                    </lightning-button>
                </footer>

            </div>
        </section>

        <!-- Backdrop -->
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
