    <div class="container">

        <!--  LEFT PANEL -->
        <div class="left-panel">

                  <h2 class="heading"><b>My Journey Progress</b></h2><br>

            <template for:each={stages} for:item="s">
                <div key={s.value} class="step-container">

                    <div class="step">
                        <div class={s.circleClass}></div>
                        <div class="label">{s.label}</div>
                    </div>

                    <template if:false={s.isLast}>
                        <div class={s.lineClass}></div>
                    </template>

                </div>
            </template>

        </div>
         </div>
