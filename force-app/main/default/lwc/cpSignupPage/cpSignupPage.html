<template>
    <div class="signup-root">

        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>

        <div class="signup-card">

            <!-- Brand -->
            <div class="brand">
                <div class="brand-mark">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="1" y="1" width="26" height="26" rx="7" stroke="var(--gold)" stroke-width="1.5"/>
                        <path d="M8 14h12M14 8v12" stroke="var(--gold)" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </div>
                <span class="brand-name">MD Realty</span>
            </div>

            <!-- Heading -->
            <div class="heading-block">
                <h1 class="heading">Create an account</h1>
                <p class="subheading">Join us — it only takes a moment.</p>
            </div>

            <!-- Error / Success alerts -->
            <template if:true={errorMessage}>
                <div class="alert alert-error" role="alert">
                    <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
                        <circle cx="8" cy="8" r="7" stroke="var(--danger)" stroke-width="1.4"/>
                        <path d="M8 5v3.5M8 11h.01" stroke="var(--danger)" stroke-width="1.4" stroke-linecap="round"/>
                    </svg>
                    <span>{errorMessage}</span>
                </div>
            </template>

            <template if:true={successMessage}>
                <div class="alert alert-success" role="status">
                    <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
                        <circle cx="8" cy="8" r="7" stroke="var(--success)" stroke-width="1.4"/>
                        <path d="M5 8l2 2 4-4" stroke="var(--success)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>{successMessage}</span>
                </div>
            </template>

            <!-- VERIFIED BADGE -->
            <template if:true={otpVerified}>
                <div class="alert alert-success" role="status">
                    <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
                        <circle cx="8" cy="8" r="7" stroke="var(--success)" stroke-width="1.4"/>
                        <path d="M5 8l2 2 4-4" stroke="var(--success)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>OTP Verified</span>
                </div>
            </template>

            <!-- Form -->
            <div class="form">

                <!-- Name row -->
                <div class="field-row">

                    <div class={firstNameClass}>
                        <label class="field-label" for="firstName">First name</label>

                        <div class="input-wrap">
                            <input
                                id="firstName"
                                class="input"
                                type="text"
                                placeholder="Jane"
                                value={firstName}
                                onchange={handleFirstNameChange}
                                onblur={handleFirstNameBlur}
                                autocomplete="given-name"
                                disabled={isFormLocked}
                            />
                        </div>

                        <template if:true={firstNameError}>
                            <span class="field-error">{firstNameError}</span>
                        </template>
                    </div>

                    <div class={lastNameClass}>
                        <label class="field-label" for="lastName">Last name</label>

                        <div class="input-wrap">
                            <input
                                id="lastName"
                                class="input"
                                type="text"
                                placeholder="Doe"
                                value={lastName}
                                onchange={handleLastNameChange}
                                onblur={handleLastNameBlur}
                                autocomplete="family-name"
                                disabled={isFormLocked}
                            />
                        </div>

                        <template if:true={lastNameError}>
                            <span class="field-error">{lastNameError}</span>
                        </template>
                    </div>

                </div>

                <!-- Email -->
                <div class={emailClass}>

                    <label class="field-label" for="email">
                        Email address
                    </label>

                    <div class="input-wrap">

                        <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <rect x="1.5" y="3.5" width="13" height="9" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
                            <path d="M1.5 5.5l6.5 4 6.5-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                        </svg>

                        <input
                            id="email"
                            class="input input--icon"
                            type="email"
                            placeholder="jane@example.com"
                            value={email}
                            onchange={handleEmailChange}
                            onblur={handleEmailBlur}
                            autocomplete="email"
                            disabled={isFormLocked}
                        />

                    </div>

                    <template if:true={emailError}>
                        <span class="field-error">{emailError}</span>
                    </template>

                </div>

                <!-- Mobile -->
                <div class={mobileClass}>

                    <label class="field-label" for="mobile">
                        Mobile Number
                    </label>

                    <div class="input-wrap">

                        <input
                            id="mobile"
                            class="input"
                            type="tel"
                            placeholder="9876543210"
                            value={mobile}
                            onchange={handlemobileChange}
                            onblur={handleMobileBlur}
                            autocomplete="tel"
                            disabled={isFormLocked}
                        />

                    </div>

                    <template if:true={mobileError}>
                        <span class="field-error">{mobileError}</span>
                    </template>

                </div>

                <!-- Password -->
                <div class={passwordClass}>

                    <label class="field-label" for="password">
                        Password
                    </label>

                    <div class="input-wrap">

                        <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <rect x="3" y="7" width="10" height="7" rx="2" stroke="currentColor" stroke-width="1.3"/>
                            <path d="M5 7V5a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                        </svg>

                        <input
                            id="password"
                            class="input input--icon input--padright"
                            type={passwordType}
                            placeholder="••••••••"
                            value={password}
                            onchange={handlePasswordChange}
                            onblur={handlePasswordBlur}
                            autocomplete="new-password"
                            disabled={isFormLocked}
                        />

                        <button
                            class="toggle-pwd"
                            type="button"
                            onclick={togglePassword}
                            title="Toggle password"
                            disabled={isFormLocked}
                        >

                            <template if:true={showPassword}>
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                                    <path d="M2 2l12 12M6.5 6.6A2 2 0 0 0 9.4 9.5M4.2 4.3C2.8 5.2 1.7 6.5 1 8c1.3 3 4.1 5 7 5 1.3 0 2.6-.4 3.7-1L4.2 4.3zm3.4-2.2C8 2 8.5 2 9 2c2.9 0 5.7 2 7 5-.5 1.1-1.2 2.1-2.1 2.9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                                </svg>
                            </template>

                            <template if:false={showPassword}>
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                                    <path d="M1 8c1.3-3 4.1-5 7-5s5.7 2 7 5c-1.3 3-4.1 5-7 5S2.3 11 1 8z" stroke="currentColor" stroke-width="1.3"/>
                                    <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/>
                                </svg>
                            </template>

                        </button>

                    </div>

                    <div class="strength-bar">
                        <div class={strengthFill}></div>
                    </div>

                    <template if:true={passwordError}>
                        <span class="field-error">{passwordError}</span>
                    </template>

                    <template if:false={passwordError}>
                        <template if:true={strengthLabel}>
                            <span class={strengthLabelClass}>
                                {strengthLabel}
                            </span>
                        </template>
                    </template>

                </div>

                <!-- Confirm Password -->
                <div class={confirmPasswordClass}>

                    <label class="field-label" for="confirmPassword">
                        Confirm password
                    </label>

                    <div class="input-wrap">

                        <svg class="input-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <rect x="3" y="7" width="10" height="7" rx="2" stroke="currentColor" stroke-width="1.3"/>
                            <path d="M5 7V5a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                        </svg>

                        <input
                            id="confirmPassword"
                            class="input input--icon"
                            type="password"
                            placeholder="••••••••"
                            value={confirmPassword}
                            onchange={handleConfirmPasswordChange}
                            onblur={handleConfirmPasswordBlur}
                            autocomplete="new-password"
                            disabled={isFormLocked}
                        />

                    </div>

                    <template if:true={confirmPasswordError}>
                        <span class="field-error">{confirmPasswordError}</span>
                    </template>

                </div>

                <!-- Submit -->
                <button
                    class="btn-primary"
                    type="button"
                    onclick={handleSignup}
                    disabled={isLoading}
                >

                    <template if:true={isLoading}>
                        <span class="spinner"></span>
                        <span>Creating account…</span>
                    </template>

                    <template if:false={isLoading}>

                        <!-- BUTTON TEXT CHANGE -->
                        <template if:true={otpVerified}>
                            <span>Create Account</span>
                        </template>

                        <template if:false={otpVerified}>
                            <span>Generate OTP</span>
                        </template>

                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <path d="M3 8h10M9 4l4 4-4 4"
                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-linecap="round"
                                stroke-linejoin="round"/>
                        </svg>

                    </template>

                </button>

                <p class="signin-prompt">
                    Already have an account?&nbsp;
                    <a href="/customerlogin" class="signin-link">
                        Sign in
                    </a>
                </p>

            </div>

        </div>
    </div>

    <!-- OTP MODAL -->
    <template if:true={showOtpModal}>
        <c-cp-otp-modal
            email={email}
            mobile={mobile}
            onverified={handleOtpVerified}
            portal-type="Customer Portal"
             otp-record-id={otpRecordId}
            otp-valid-till={otpValidTill}
            onclose={handleOtpClose}>
        </c-cp-otp-modal>
    </template>

</template>
