<template>

    <div class="table-container">

        <table class="custom-table">

            <thead>
                <tr>
                    <template for:each={columns} for:item="col">
                        <th key={col.fieldPath}>
                            {col.label}
                        </th>
                    </template>
                </tr>
            </thead>

            <tbody>

                <template if:true={invoices}>

                    <template for:each={invoices} for:item="invoices">

                        <tr key={invoices.Id}>

                            <template for:each={invoices.values} for:item="val">

                                <td key={val.field}>
                                    {val.value}
                                </td>

                            </template>

                        </tr>

                    </template>

                </template>

            </tbody>

        </table>

    </div>

</template>
